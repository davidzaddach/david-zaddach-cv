[build]
  publish = "public"

[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Disposition = "attachment; filename=\"David_Zaddach_CV_EN_2026.pdf\""

[[redirects]]
  from = "/cv.pdf"
  to = "/David_Zaddach_CV_EN_2026.pdf"
  status = 200

[[redirects]]
  from = "/cv-web.pdf"
  to = "/David_Zaddach_CV_EN_2026_web.pdf"
  status = 200
